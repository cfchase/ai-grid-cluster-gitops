apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'cluster-config-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://github.com/cfchase/ai-grid-tenant.git
          targetRevision: demo-template
          path: cluster-config/chart
          helm:
            releaseName: cluster-admins
            # A deployment's cluster-admins.yaml replaces this repository's list
            # (Helm replaces lists). The chart fails if neither file names one.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/cluster-config/values.yaml
              - $deployment/{{ .values.deploymentPath }}/cluster-admins.yaml
            parameters:
              - name: hubResources.enabled
                value: '{{ eq .name "local-cluster" | toString }}'
        - repoURL: https://github.com/cfchase/ai-grid-tenant.git
          targetRevision: demo-template
          ref: values
        - repoURL: '{{ .values.deploymentRepoURL }}'
          targetRevision: '{{ .values.deploymentRevision }}'
          ref: deployment
      destination:
        server: '{{ if eq .name "local-cluster" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: openshift-gitops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
